<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <title>Array JavaScript</title>
    </head>
    <body>
        <h2>Array JavaScript</h2>
        <script>
        var data = ["satu", 2, true];
        var arr2 = [["satu", "dua"], ["tiga", "empat"]];
        
        document.write("data[2]: " + data[2] + "<br>");
        document.write("arr2[0][1]: " + arr2[0][1] + "<br>"); 
        document.write("data[10]: " + data[10] + "<br><br>"); 
        
        var data2 = ["a", "b", "c"];
        document.write("Panjang array: " + data2.length + "<br>");

        data2.push("d");
        document.write("Setelah push: " + data2 + "<br>");

        data2.pop();
        document.write("Setelah pop: " + data2 + "<br>");
        </script>
    </body>
</html>
