<!DOCTYPE html>
<html>
    <head>
        <title>Contoh Bootstrap Container</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <h2 class="text-center">Contoh Bootstrap Container Punya Dita</h2>
        <!-- Container dengan lebar tetap -->
        <div class="container bg-light p-3 mt-3">
            <h4>.container</h4>
            <p>
                Container ini memiliki lebar tetap dan akan menyesuaikan ukuran layar pada breakpoint tertentu.
            </p>
        </div>

        <!-- Container dengan lebar penuh -->
        <div class="container-fluid bg-secondary text-white p-3 mt-3">
            <h4>.container-fluid</h4>
            <p>
                Container ini memiliki lebar penuh yang mencakup seluruh area layar.
            </p>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
