<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contoh Bootstrap Button</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h4>Button Styles Dita</h4>
        <button type="button" class="btn btn-secondary me-2">Secondary</button>
        <button type="button" class="btn btn-primary btn-lg me-2">Primary</button>
        <button type="button" class="btn btn-success w-100 mt-2">Success</button>
        <button type="button" class="btn btn-info btn-sm me-2 mt-2">Info</button>
        <button type="button" class="btn btn-warning me-2 mt-2">Warning</button>
        <button type="button" class="btn btn-danger me-2 mt-2">Danger</button>
        <button type="button" class="btn btn-link mt-2">Link</button>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
