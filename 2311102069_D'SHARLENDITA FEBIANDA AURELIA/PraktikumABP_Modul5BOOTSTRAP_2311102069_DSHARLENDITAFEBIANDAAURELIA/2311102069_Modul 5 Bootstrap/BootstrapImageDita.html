<!DOCTYPE html>

</head>
<body>

<div class="container mt-4">

            <h4>Gambar Thumbnail</h4>
            <img src="DsharlenditaFebiandaAurelia_2311102069.jpg" class="img-thumbnail w-50" alt="Thumbnail">
        </div>

        <div class="col-md-6 text-center">
            <h4>Gambar Responsive / Fluid</h4>
            <img src="DsharlenditaFebiandaAurelia_2311102069.jpg" class="img-fluid w-50" alt="Responsive Image">
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
