<!DOCTYPE html>
<html>
<head>
    <title>Contoh Bootstrap Grid</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
    <div class="container mt-4">
        <h2 class="text-center">Contoh Bootstrap Grid System Punya Dita</h2>
        <div class="row">
            <div class="col-12 col-md-8 bg-light border p-2">
                .col-12 .col-md-8
            </div>

            <div class="col-6 col-md-4 bg-secondary text-white border p-2">
                .col-6 .col-md-4
            </div>
        </div>

        <div class="row mt-2">
            <div class="col-6 col-md-4 bg-light border p-2">
                .col-6 .col-md-4
            </div>

            <div class="col-6 col-md-4 bg-secondary text-white border p-2">
                .col-6 .col-md-4
            </div>

            <div class="col-6 col-md-4 bg-light border p-2">
                .col-6 .col-md-4
            </div>
        </div>

        <div class="row mt-2">
            <div class="col-6 bg-secondary text-white border p-2">
                .col-6
            </div>

            <div class="col-6 bg-light border p-2">
                .col-6
            </div>
        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
